<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta charset="UTF-8">
  <title>Controle Pacientes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff69b4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #fbc2eb, #ff9a9e);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    h1, h3 {
      text-align: center;
      color: white;
    }

    input, button, select {
      padding: 12px;
      margin: 8px 0;
      width: 100%;
      border-radius: 10px;
      border: none;
    }

    .card {
      position: relative;
      background: rgba(255,255,255,0.2);
      padding: 15px;
      margin-top: 12px;
      border-radius: 15px;
      color: white;
    }

    button {
      background: linear-gradient(45deg, #024f14, #28a745);
      color: white;
      cursor: pointer;
    }

    .btn-excluir {
      background: #dc3545;
    }

    .btn-copy {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="app-container">

  <h1>Meus Pacientes</h1>

  <h3>Novo Paciente</h3>
  <input type="text" id="nome" placeholder="Nome">
  <input type="number" id="valor" placeholder="Valor">
  <button onclick="adicionarPaciente()">Cadastrar</button>

  <h3>Pacientes</h3>

  <button onclick="abrirAgenda()">📅 Abrir Agenda</button>
  <button onclick="fecharMes()">Fechar Mês</button>
  <button class="btn-excluir" onclick="excluirTodos()">Excluir Todos</button>

  <div id="lista"></div>

  <!-- AGENDA -->
  <div id="agenda" style="display:none; margin-top:20px;">
    <h3>Agenda</h3>

    <input type="date" id="dataAgenda" onchange="renderAgenda()">
    <input type="time" id="horaAgenda">

    <select id="pacienteAgenda"></select>

    <button onclick="salvarAgendamento()">Salvar Agendamento</button>

    <div id="listaAgenda"></div>
  </div>

</div>

<script>
let pacientes = JSON.parse(localStorage.getItem("pacientes")) || [];
let agendamentos = JSON.parse(localStorage.getItem("agendamentos")) || [];

function salvar() {
  localStorage.setItem("pacientes", JSON.stringify(pacientes));
  localStorage.setItem("agendamentos", JSON.stringify(agendamentos));
}

// PACIENTES
function adicionarPaciente() {
  const nome = nome.value;
  const valorSessao = parseFloat(valor.value);

  if (!nome || !valorSessao) return alert("Preencha");

  pacientes.push({
    id: Date.now(),
    nome,
    valorSessao,
    checkins: []
  });

  salvar();
  render();
}

function adicionarCheckin(id) {
  const p = pacientes.find(p => p.id === id);
  p.checkins.push({ data: new Date(), valor: p.valorSessao });
  salvar();
  render();
}

function excluirPaciente(id) {
  pacientes = pacientes.filter(p => p.id !== id);
  salvar();
  render();
}

function excluirTodos() {
  if (!confirm("Excluir todos?")) return;
  pacientes = [];
  salvar();
  render();
}

function fecharMes() {
  pacientes.forEach(p => p.checkins = []);
  salvar();
  render();
}

function alterarValor(id) {
  const p = pacientes.find(p => p.id === id);
  const v = prompt("Novo valor:");
  if (!v) return;
  p.valorSessao = parseFloat(v);
  salvar();
  render();
}

function calcularTotalMes(p) {
  const hoje = new Date();
  return p.checkins
    .filter(c => {
      const d = new Date(c.data);
      return d.getMonth() === hoje.getMonth();
    })
    .reduce((t, c) => t + c.valor, 0);
}

function copiarInfo(id) {
  const p = pacientes.find(p => p.id === id);
  const total = calcularTotalMes(p);

  const texto = `Paciente: ${p.nome}
Valor: R$ ${p.valorSessao}
Total mês: R$ ${total}`;

  navigator.clipboard.writeText(texto);
}

// RENDER PACIENTES
function render() {
  lista.innerHTML = "";

  pacientes.forEach(p => {
    const total = calcularTotalMes(p);

    lista.innerHTML += `
      <div class="card">
        <button class="btn-copy" onclick="copiarInfo(${p.id})">📋</button>

        <strong>${p.nome}</strong><br>
        R$ ${p.valorSessao}<br>
        Total: R$ ${total}<br><br>

        <button onclick="adicionarCheckin(${p.id})">Check-in</button>
        <button onclick="alterarValor(${p.id})">Alterar</button>
        <button class="btn-excluir" onclick="excluirPaciente(${p.id})">Excluir</button>
      </div>
    `;
  });
}

// AGENDA
function abrirAgenda() {
  agenda.style.display = "block";

  pacienteAgenda.innerHTML = "";
  pacientes.forEach(p => {
    pacienteAgenda.innerHTML += `<option value="${p.id}">${p.nome}</option>`;
  });
}

function salvarAgendamento() {
  const data = dataAgenda.value;
  const hora = horaAgenda.value;
  const pacienteId = pacienteAgenda.value;

  if (!data || !hora) return alert("Preencha");

  agendamentos.push({
    id: Date.now(),
    data,
    hora,
    pacienteId
  });

  salvar();
  renderAgenda();
}

function renderAgenda() {
  const data = dataAgenda.value;
  listaAgenda.innerHTML = "";

  agendamentos
    .filter(a => a.data === data)
    .sort((a,b) => a.hora.localeCompare(b.hora))
    .forEach(a => {
      const p = pacientes.find(p => p.id == a.pacienteId);

      listaAgenda.innerHTML += `
        <div class="card">
          ⏰ ${a.hora} - ${p ? p.nome : "?"}
        </div>
      `;
    });
}

render();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
