<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta charset="UTF-8">
  <title>Controle Pacientes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff69b4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">

  <!-- FULLCALENDAR -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #fbc2eb, #ff9a9e);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: white;
    }

    h3 {
      color: white;
      margin-top: 20px;
    }

    input, button {
      padding: 12px;
      margin: 8px 0;
      width: 100%;
      border-radius: 10px;
      border: none;
    }

    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      padding: 15px;
      margin-top: 12px;
      border-radius: 15px;
      color: white;
    }

    button {
      background: linear-gradient(45deg, #024f14, #28a745);
      color: white;
    }

    .btn-excluir {
      background: #dc3545;
    }

    .btn-copy {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 36px;
      height: 36px;
    }

    #calendar {
      margin-top: 20px;
      background: white;
      border-radius: 10px;
      padding: 10px;
    }
  </style>
</head>

<body>

<div class="app-container">

  <h1>Meus Pacientes</h1>

  <h3>Novo Paciente</h3>
  <input type="text" id="nome" placeholder="Nome do paciente">
  <input type="number" id="valor" placeholder="Valor por sessão">
  <button onclick="adicionarPaciente()">Cadastrar</button>

  <h3>Pacientes</h3>

  <button onclick="abrirAgenda()">📅 Abrir Agenda</button>
  <button onclick="fecharMes()">Fechar Mês</button> 
  <button class="btn-excluir" onclick="excluirTodos()">Excluir Todos</button>

  <div id="lista"></div>

  <!-- CALENDÁRIO -->
  <div id="agenda" style="display:none;">
    <h3>Agenda</h3>
    <div id="calendar"></div>
  </div>

</div>

<script>
let pacientes = JSON.parse(localStorage.getItem("pacientes")) || [];
let agendamentos = JSON.parse(localStorage.getItem("agendamentos")) || [];

function salvar() {
  localStorage.setItem("pacientes", JSON.stringify(pacientes));
  localStorage.setItem("agendamentos", JSON.stringify(agendamentos));
}

// ===== PACIENTES =====
function adicionarPaciente() {
  const nome = document.getElementById("nome").value;
  const valor = parseFloat(document.getElementById("valor").value);

  if (!nome || !valor) return alert("Preencha todos os campos");

  pacientes.push({
    id: Date.now(),
    nome,
    valorSessao: valor,
    checkins: []
  });

  salvar();
  render();
}

function adicionarCheckin(id) {
  const paciente = pacientes.find(p => p.id === id);
  paciente.checkins.push({
    data: new Date().toISOString(),
    valor: paciente.valorSessao
  });
  salvar();
  render();
}

function excluirPaciente(id) {
  if (!confirm("Tem certeza que deseja excluir este paciente?")) return;
  pacientes = pacientes.filter(p => p.id !== id);
  salvar();
  render();
}

function excluirTodos() {
  if (!confirm("Excluir todos?")) return;
  pacientes = [];
  salvar();
  render();
}

function fecharMes() {
  pacientes.forEach(p => p.checkins = []);
  salvar();
  render();
}

function alterarValor(id) {
  const paciente = pacientes.find(p => p.id === id);
  const novoValor = prompt(`Valor atual: R$ ${paciente.valorSessao}`);

  if (!novoValor) return;

  const valorNumerico = parseFloat(novoValor);
  if (isNaN(valorNumerico)) return alert("Valor inválido");

  paciente.valorSessao = valorNumerico;
  salvar();
  render();
}

function calcularTotalMes(paciente) {
  const hoje = new Date();
  return paciente.checkins
    .filter(c => {
      const d = new Date(c.data);
      return d.getMonth() === hoje.getMonth() &&
             d.getFullYear() === hoje.getFullYear();
    })
    .reduce((t, c) => t + c.valor, 0);
}

// ===== WHATSAPP (INALTERADO) =====
function copiarInfo(id) {
  const paciente = pacientes.find(p => p.id === id);
  const total = calcularTotalMes(paciente);

  const hoje = new Date();
  const mesAno = `${String(hoje.getMonth() + 1).padStart(2, '0')}/${hoje.getFullYear()}`;

  const sessoesMes = paciente.checkins.filter(c => {
    const d = new Date(c.data);
    return d.getMonth() === hoje.getMonth() &&
           d.getFullYear() === hoje.getFullYear();
  }).length;

  const texto =
`📋 *Resumo de Atendimento*

👤 Paciente: ${paciente.nome}
📅 Mês: ${mesAno}
💰 Valor da sessão: R$ ${paciente.valorSessao}
🧾 Sessões realizadas: ${sessoesMes}
💵 Total no mês: R$ ${total}

Qualquer dúvida estou à disposição!`;

  navigator.clipboard.writeText(texto)
    .then(() => alert("Informações copiadas!"));
}

// ===== RENDER =====
function render() {
  lista.innerHTML = "";

  pacientes.forEach(p => {
    const total = calcularTotalMes(p);

    lista.innerHTML += `
      <div class="card">
        <button class="btn-copy" onclick="copiarInfo(${p.id})">📋</button>

        <strong>${p.nome}</strong><br>
        Valor sessão: R$ ${p.valorSessao}<br>
        Total mês: R$ ${total}<br><br>

        <button onclick="adicionarCheckin(${p.id})">Check-in</button>
        <button onclick="alterarValor(${p.id})">Alterar</button>
        <button class="btn-excluir" onclick="excluirPaciente(${p.id})">Excluir</button>
      </div>
    `;
  });
}

// ===== AGENDA GOOGLE STYLE =====
function abrirAgenda() {
  agenda.style.display = "block";

  setTimeout(() => {
    const calendarEl = document.getElementById('calendar');

    const calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      locale: 'pt-br',

      events: agendamentos.map(a => {
        const p = pacientes.find(p => p.id == a.pacienteId);
        return {
          id: a.id,
          title: p ? p.nome : "Paciente",
          start: a.data + "T" + a.hora
        };
      }),

      dateClick: function(info) {
        const hora = prompt("Digite o horário (ex: 14:00)");
        if (!hora) return;

        let lista = pacientes.map(p => `${p.id} - ${p.nome}`).join("\n");
        const pacienteId = prompt("Escolha o ID:\n" + lista);

        if (!pacienteId) return;

        agendamentos.push({
          id: Date.now(),
          data: info.dateStr,
          hora: hora,
          pacienteId: pacienteId
        });

        salvar();
        calendar.refetchEvents();
      },

      eventClick: function(info) {
        if (confirm("Excluir agendamento?")) {
          agendamentos = agendamentos.filter(a => a.id != info.event.id);
          salvar();
          calendar.refetchEvents();
        }
      }
    });

    calendar.render();
  }, 200);
}

render();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
