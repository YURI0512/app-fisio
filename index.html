<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle Pacientes</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FULLCALENDAR -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #fbc2eb, #ff9a9e);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 20px;
    }

    h3 {
      color: white;
      margin-top: 20px;
    }

    input, button, select {
      padding: 12px;
      margin: 8px 0;
      width: 100%;
      border-radius: 10px;
      border: none;
    }

    .card {
      position: relative;
      background: rgba(255,255,255,0.2);
      padding: 15px;
      margin-top: 12px;
      border-radius: 15px;
      color: white;
    }

    button {
      background: #28a745;
      color: white;
      cursor: pointer;
    }

    .btn-excluir {
      background: #dc3545;
    }

    #calendar {
      margin-top: 20px;
      background: rgb(255, 255, 255);
      border-radius: 10px;
      padding: 10px;
    }

    #modalAgenda {
      display: none;
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
    }
    .btn-copy {
  position: absolute;
  top: 10px;
  right: 10px;

  width: 36px;
  height: 36px;

  border-radius: 8px;
  font-size: 18px;

  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.3);

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
  padding: 0; /* 🔥 importante pra não ficar gigante */
  margin: 0;  /* 🔥 evita deslocamento */

  transition: 0.2s;
}

.btn-copy:hover {
  transform: scale(1.1);
}
  </style>
</head>

<body>

<div class="app-container">

  <h1>Meus Pacientes</h1>

  <h3>Novo Paciente</h3>
  <input type="text" id="nome" placeholder="Nome do paciente">
  <input type="number" id="valor" placeholder="Valor por sessão">
  <button onclick="adicionarPaciente()">Cadastrar</button>

  <h3>Pacientes</h3>

  <!-- 🔥 NOVO BOTÃO -->
  <button onclick="abrirAgenda()">📅 Abrir Agenda</button>

  <button onclick="fecharMes()">Fechar Mês</button> 
  <button class="btn-excluir" onclick="excluirTodos()">Excluir Todos os Pacientes</button>

  <div id="lista"></div>

  <!-- 🔥 AGENDA -->
  <div id="agenda" style="display:none;">
    <div id="calendar"></div>

    <div id="modalAgenda">
      <h4>Novo Agendamento</h4>
      <input type="time" id="horaAgenda">
      <select id="pacienteAgenda"></select>
      <button onclick="salvarAgendamento()">Salvar</button>
      <button onclick="fecharModal()">Cancelar</button>
    </div>
  </div>

</div>

<script>

// ===== DADOS =====
let pacientes = JSON.parse(localStorage.getItem("pacientes")) || [];
let agendamentos = JSON.parse(localStorage.getItem("agendamentos")) || [];

let calendarGlobal = null;
let dataSelecionada = null;

// ===== SALVAR =====
function salvar() {
  localStorage.setItem("pacientes", JSON.stringify(pacientes));
  localStorage.setItem("agendamentos", JSON.stringify(agendamentos));
}

// ===== PACIENTES =====
function adicionarPaciente() {
  const nome = document.getElementById("nome").value;
  const valor = parseFloat(document.getElementById("valor").value);

  if (!nome || !valor) return alert("Preencha todos os campos");

  pacientes.push({
    id: Date.now(),
    nome,
    valorSessao: valor,
    checkins: []
  });

  salvar();
  render();
}

function adicionarCheckin(id) {
  const paciente = pacientes.find(p => p.id === id);

  paciente.checkins.push({
    data: new Date().toISOString(),
    valor: paciente.valorSessao
  });

  salvar();
  render();
}

function excluirPaciente(id) {
  if (!confirm("Excluir paciente?")) return;
  pacientes = pacientes.filter(p => p.id !== id);
  salvar();
  render();
}

function fecharPaciente(id) {
  const paciente = pacientes.find(p => p.id === id);

  if (!confirm("Zerar sessões desse paciente?")) return;

  paciente.checkins = [];
  salvar();
  render();
}

function alterarValor(id) {
  const paciente = pacientes.find(p => p.id === id);
  const novoValor = prompt(`Valor atual: R$ ${paciente.valorSessao}`);

  if (!novoValor) return;

  paciente.valorSessao = parseFloat(novoValor);
  salvar();
  render();
}

// ===== CALCULOS =====
function calcularTotalMes(paciente) {
  const hoje = new Date();

  return paciente.checkins
    .filter(c => {
      const d = new Date(c.data);
      return d.getMonth() === hoje.getMonth() &&
             d.getFullYear() === hoje.getFullYear();
    })
    .reduce((t, c) => t + c.valor, 0);
}

// ===== WHATSAPP =====
function copiarInfo(id) {
  const paciente = pacientes.find(p => p.id === id);
  const total = calcularTotalMes(paciente);

  const hoje = new Date();
  const mesAno = `${String(hoje.getMonth() + 1).padStart(2, '0')}/${hoje.getFullYear()}`;

  // 🔥 filtra checkins do mês atual
  const checkinsMes = paciente.checkins.filter(c => {
    const d = new Date(c.data);
    return d.getMonth() === hoje.getMonth() &&
           d.getFullYear() === hoje.getFullYear();
  });

  const sessoesMes = checkinsMes.length;

  // 🔥 monta lista de dias
  let listaDias = "";
  checkinsMes.forEach(c => {
    const d = new Date(c.data);
    const dia = String(d.getDate()).padStart(2, '0');
    const mes = String(d.getMonth() + 1).padStart(2, '0');

    listaDias += `📅 ${dia}/${mes} - R$ ${c.valor}\n`;
  });

  if (!listaDias) {
    listaDias = "Nenhuma sessão registrada.";
  }

  const texto =
`📋 *Resumo de Atendimento*

👤 Paciente: ${paciente.nome}
📅 Mês: ${mesAno}
💰 Valor da sessão: R$ ${paciente.valorSessao}

🧾 Sessões realizadas: ${sessoesMes}

📆 *Dias das sessões:*
${listaDias}

💵 *Total no mês: R$ ${total}*

Qualquer dúvida estou à disposição!`;

  navigator.clipboard.writeText(texto)
    .then(() => alert("Informações copiadas!"));
}
// ===== HISTORICO =====
function verHistorico(id) {
  const paciente = pacientes.find(p => p.id === id);

  let texto = "Histórico:\n";

  paciente.checkins.forEach(c => {
    texto += new Date(c.data).toLocaleString() + " - R$ " + c.valor + "\n";
  });

  alert(texto || "Sem histórico");
}

// ===== RENDER =====
function render() {
  lista.innerHTML = "";

  pacientes.forEach(p => {
    const total = calcularTotalMes(p);

    lista.innerHTML += `
      <div class="card">

        <button class="btn-copy" onclick="copiarInfo(${p.id})">📋</button>

        <strong>${p.nome}</strong><br>
        Valor sessão: R$ ${p.valorSessao}<br>
        Total mês: R$ ${total}<br><br>

        <button onclick="adicionarCheckin(${p.id})">Check-in</button>
        <button onclick="alterarValor(${p.id})">Alterar</button>
        <button onclick="verHistorico(${p.id})">Histórico</button>
        <button onclick="fecharPaciente(${p.id})">Fechar Paciente</button>
        <button class="btn-excluir" onclick="excluirPaciente(${p.id})">Excluir</button>
      </div>
    `;
  });
}

// ===== AGENDA =====
function abrirAgenda() {
  agenda.style.display = "block";

  setTimeout(() => {
    const calendarEl = document.getElementById("calendar");

    if (calendarGlobal) {
      calendarGlobal.refetchEvents();
      return;
    }

    calendarGlobal = new FullCalendar.Calendar(calendarEl, {
      initialView: 'timeGridWeek',
      locale: 'pt-br',
      selectable: true,
      editable: true,
      allDaySlot: false,

      events: function(fetchInfo, successCallback) {
        const eventos = agendamentos.map(a => {
          const p = pacientes.find(p => p.id == a.pacienteId);

          return {
            id: a.id,
            title: p ? p.nome : "Paciente",
            start: a.data + "T" + a.hora,
            color: a.status === "realizado" ? "green" : "blue"
          };
        });

        successCallback(eventos);
      },

      select: function(info) {
        dataSelecionada = info.startStr.split("T")[0];

        document.getElementById("horaAgenda").value =
          info.startStr.split("T")[1]?.slice(0,5) || "";

        const select = document.getElementById("pacienteAgenda");
        select.innerHTML = "";

        pacientes.forEach(p => {
          select.innerHTML += `<option value="${p.id}">${p.nome}</option>`;
        });

        modalAgenda.style.display = "block";
      },

      eventDrop: function(info) {
        const ag = agendamentos.find(a => a.id == info.event.id);

        if (ag) {
          const d = info.event.start;
          ag.data = d.toISOString().split("T")[0];
          ag.hora = d.toTimeString().slice(0,5);
          salvar();
        }
      },

      eventClick: function(info) {
        const ag = agendamentos.find(a => a.id == info.event.id);

        const opcao = prompt(
`1 - Marcar como realizado
2 - Excluir`
        );

        if (opcao == "1") {
          if (ag.status === "realizado") return alert("Já realizado");

          const paciente = pacientes.find(p => p.id == ag.pacienteId);

          paciente.checkins.push({
            data: new Date().toISOString(),
            valor: paciente.valorSessao
          });

          ag.status = "realizado";

          salvar();
          render();
        }

        if (opcao == "2") {
          agendamentos = agendamentos.filter(a => a.id != ag.id);
          salvar();
        }

        calendarGlobal.refetchEvents();
      }

    });

    calendarGlobal.render();
  }, 200);
}

// ===== SALVAR AGENDAMENTO =====
function salvarAgendamento() {
  const hora = document.getElementById("horaAgenda").value;
  const pacienteId = document.getElementById("pacienteAgenda").value;

  if (!hora) return alert("Escolha horário");

  agendamentos.push({
    id: Date.now(),
    data: dataSelecionada,
    hora,
    pacienteId,
    status: "pendente"
  });

  salvar();
  calendarGlobal.refetchEvents();
  fecharModal();
}

// ===== MODAL =====
function fecharModal() {
  modalAgenda.style.display = "none";
}

// ===== INIT =====
render();

</script>

</body>
</html>
